[project]
name = "cleanup-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amiralimollaei", email = "me.amiralimollaei@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "tqdm>=4.70.0",
]

[project.scripts]
cleanup-cli = "cleanup_cli:main"
cleanup-gui = "cleanup_cli.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.0",
]

gui = [
    "pygobject>=3.56.3",
]

scipy = [
    "scipy>=1.16.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
