[project]
name = "cleanup-gui"
version = "0.1.0"
description = "GTK graphical interface for cleanup-cli."
readme = "README.md"
authors = [
    { name = "amiralimollaei", email = "me.amiralimollaei@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cleanup-cli>=0.1.0",
    "pygobject>=3.56.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
